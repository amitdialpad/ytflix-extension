<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YTFLIX</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <p class="brand">YTFLIX</p>
      <h1>Tonight’s YouTube, recut.</h1>
      <label class="toggle-row" for="enabled">
        <span>
          <strong>Useless project #4984</strong>
          <small id="status">Checking…</small>
        </span>
        <span class="switch">
          <input id="enabled" type="checkbox">
          <span class="switch__track" aria-hidden="true"></span>
        </span>
      </label>
      <p class="note">Reload an open YouTube tab once after first loading the extension.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
